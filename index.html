  <title>轻盈日记 · 饮食与体重记录</title>
  <style>
    :root{ --paper:#f6f7f4; --white:#fff; --ink:#243630; --inksoft:#53675c; --muted:#819087; --line:#e7ebe5; --green:#25775e; --green-deep:#145841; --mint:#e3f1e7; --mint-2:#f0f8f2; --yellow:#f5bc68; --warm:#fff7e8; --red:#ca6850; --shadow:0 12px 40px rgba(27,67,43,.06); --radius:22px; }
    *{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{background:#e9ede9;margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9bcab6;outline-offset:2px}button:disabled{opacity:.45;cursor:default}svg{display:block} .shell{max-width:470px;margin:auto;min-height:100dvh;background:var(--paper);position:relative;box-shadow:0 0 60px rgba(18,62,35,.08)} .main{padding:0 20px calc(110px + env(safe-area-inset-bottom))} .topbar{height:83px;display:flex;justify-content:space-between;align-items:center;padding:15px 20px 10px} .brand{display:flex;gap:10px;align-items:center} .logo{background:var(--green);height:40px;width:40px;border-radius:14px;display:grid;place-items:center;color:white;box-shadow:0 5px 14px rgba(37,119,94,.2)} .brandname{font-size:18px;font-weight:800;letter-spacing:-.7px} .branddesc{color:var(--muted);font-size:10px;margin-top:2px;font-weight:600;letter-spacing:.7px}.avatar{background:white;border:1px solid var(--line);width:40px;height:40px;border-radius:15px;display:grid;place-items:center;color:var(--green)}
    .date-nav{display:flex;justify-content:space-between;align-items:center;margin:12px 0 18px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--green);margin-bottom:5px}.date-text{font-size:25px;font-weight:800;letter-spacing:-.8px}.date-text small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}.date-actions{display:flex;gap:7px}.icon-btn{border:1px solid var(--line);background:#fff;color:var(--ink);width:39px;height:39px;border-radius:13px;display:grid;place-items:center}.card{background:var(--white);border:1px solid #eef0eb;border-radius:var(--radius);box-shadow:var(--shadow)}
    .hero{background:linear-gradient(135deg,#e1f1e5 0%,#eaf5e7 62%,#f6f8e9 100%);padding:21px 20px;display:flex;align-items:center;gap:18px;border:1px solid #d9e9df;border-radius:26px;min-height:210px}.hero-info{flex:1;min-width:0}.hero-title{font-size:20px;font-weight:800;line-height:1.4;letter-spacing:-.6px}.hero-sub{color:#5e7c6a;font-size:12px;margin:7px 0 16px;line-height:1.55}.hero-number{font-size:28px;font-weight:850;letter-spacing:-1px;font-variant-numeric:tabular-nums}.hero-number span{font-size:13px;color:#729180;font-weight:600;letter-spacing:0}.hero-under{margin-top:3px;font-size:12px;color:#4b7660}.ring{--pct:0%;width:128px;height:128px;flex:none;border-radius:50%;background:conic-gradient(var(--green) 0 var(--pct),#c8decf var(--pct) 100%);display:grid;place-items:center}.ring-core{background:#e9f5e9;width:103px;height:103px;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center}.ring-core strong{font-size:27px;letter-spacing:-1px;font-variant-numeric:tabular-nums}.ring-core span{font-size:11px;color:#6b8774}.section-head{display:flex;align-items:center;justify-content:space-between;margin:25px 0 13px}.section-head h2{font-size:17px;letter-spacing:-.3px;margin:0}.section-head .hint{font-size:11px;color:var(--muted)}.tiny-link{background:none;border:none;padding:6px 0;color:var(--green);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}.split{display:grid;grid-template-columns:1fr 1fr;gap:11px}.metric{padding:17px 16px 15px;min-height:130px}.metric .name{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:7px}.metric .value{font-size:26px;font-weight:850;margin-top:11px;letter-spacing:-.8px;font-variant-numeric:tabular-nums}.metric .unit{color:var(--muted);font-size:12px;font-weight:500}.bar{height:7px;background:#edf0eb;border-radius:99px;overflow:hidden;margin-top:10px}.bar-fill{height:100%;border-radius:99px;background:var(--green);max-width:100%;transition:width .3 r:0;background:none;resize:vertical;min-height:56px;color:var(--ink);outline:none;line-height:1.6;font-size:13px}.note-input::placeholder{color:#aab5ab}
    .bottom-nav{position:fixed;bottom:0;width:min(100%,470px);height:calc(75px + env(safe-area-inset-bottom));padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-top:1px solid #e8ece7;backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(4,1fr);z-index:15}.navitem{border:0;background:transparent;color:#99a69c;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;font-size:10px;font-weight:700}.navitem.active{color:var(--green)}.navitem.active .nav-icon{background:#e8f3eb}.nav-icon{width:43px;height:34px;border-radius:12px;display:grid;place-items:center}
    .page-title{font-size:28px;letter-spacing:-1px;font-weight:850;margin:18px 0 6px}.page-sub{font-size:12px;color:var(--muted);line-height:1.65;margin-bottom:22px}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.statbox{padding:16px 11px;text-align:center}.statval{font-size:18px;font-weight:850;font-variant-numeric:tabular-nums}.statlabel{font-size:10px;color:var(--muted);margin-top:5px}.chart-card{padding:16px;margin-top:12px}.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.chart-title{font-size:15px;font-weight:800}.chip{padding:6px 10px;border-radius:99px;background:#edf6ef;color:var(--green);font-size:11px;font-weight:750}.weight-chart{width:100%;height:200px}.chart-empty{height:184px;border-radius:13px;background:#f6f8f5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;text-align:center;color:var(--muted);font-size:12px;padding:22px}.chart-helper{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px}.weekly-bars{display:flex;align-items:end;justify-content:space-around;height:120px;gap:10px;padding:10px 2px 0}.week-col{display:flex;align-items:center;flex-direction:column;justify-content:end;flex:1;height:100%;gap:7px}.week-track{width:20px;height:90px;background:#eff2ed;border-radius:7px;display:flex;align-items:end;overflow:hidden}.week-fill{width:100%;background:#8dbca2;border-radius:7px;height:0}.week-day{font-size:10px;color:var(--muted)}.week-blank{font-size:10px;color:#b0b9b1;line-height:1}.calendar{padding:15px}.cal-head{display:flex;justify-content:space-between;align-items:center;padding:0 5px 15px}.cal-title{font-size:16px;font-weight:800}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center}.cal-week{font-size:11px;color:var(--muted);padding:5px 0}.cal-day{height:39px;border:0;background:transparent;border-radius:13px;position:relative;font-size:13px;color:var(--ink);font-weight:650}.cal-day.has{background:#e     .settings-card{padding:17px;margin:12px 0}.settings-card h3{margin:0 0 15px;font-size:15px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-size:11px;color:#637568;font-weight:750}.input{background:#f8faf7;border:1px solid #e5ece5;border-radius:12px;padding:13px 12px;width:100%;color:var(--ink);outline:none}.input:focus{border-color:#6bac90}.settings-actions{display:grid;gap:9px}.action-row{display:flex;justify-content:space-between;align-items:center;gap:13px;width:100%;padding:15px 2px;border:0;background:none;text-align:left;border-top:1px solid #eff1ed}.action-row strong{font-size:13px}.action-row small{display:block;font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}.action-row svg{color:var(--green);flex:none}.alert{background:#fff7ed;border:1px solid #f2e5d0;color:#906e46;border-radius:15px;font-size:11px;line-height:1.7;padding:13px 15px}.primary{background:var(--green);color:white;border:0;padding:13px 17px;border-radius:13px;font-size:13px;font-weight:800}.secondary{background:#edf4ef;border:0;color:var(--green);padding:13px 17px;border-radius:13px;font-size:13px;font-weight:800}.danger{color:var(--red)!important}.banner{background:#e8f3eb;padding:12px 14px;border-radius:14px;color:#32674c;font-size:12px;line-height:1.7;margin-bottom:14px}.tiny-foot{text-align:center;color:#a2aca4;font-size:10px;padding:22px 0 6px}
    dialog{border:none;border-radius:25px 25px 0 0;box-shadow:0 -8px 80px #24363028;width:min(100%,470px);max-width:470px;max-height:92dvh;margin:0 auto 0;top:auto;bottom:0;padding:0;background:white;color:var(--ink);overflow:auto}dialog::backdrop{background:rgba(15,29,23,.42);backdrop-filter:blur(2px)}.dialog-body{padding:20px 20px calc(24px + env(safe-area-inset-bottom))}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.dialog-title{font-size:19px;font-weight:850}.close{background:#f1f4ef;border:0;width:31px;height:31px;border-radius:10px;font-size:20px;display:grid;place-items:center;color:#708275}.search-box{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#fafbf9;margin:0 0 10px;outline:none}.preset-list{max-height:148px;overflow:auto;border:1px solid var(--line);border-radius:13px;margin-bottom:17px}.preset-option{width:100%;padding:11px 13px;background:white;border:0;display:flex;justify-content:space-between;gap:12px;text-align:left;border-bottom:1px solid #f0f2ef}.preset-option:last-child{border-bottom:0}.preset-option strong{font-size:12px}.preset-option small{font-size:10px;color:var(--muted)}.dialog-form .field{margin-bottom:12px}.dialog-label{font-size:11px;color:var(--muted);font-weight:700}.dialog-num{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dialog-actions{display:flex;gap:10px;margin-top:15px}.dialog-actions .primary{flex:1}.dialog-actions .secondary{flex:1}.toast{position:fixed;z-index:60;bottom:calc(95px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:white;font-size:12px;font-weight:700;padding:12px 17px;border-radius:99px;white-space:nowrap;box-shadow:0 15px 35px #12352728;opacity:0;pointer-events:none;transition:.25s}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}.confirm-note{font-size:12px;color:var(--muted);line-height:1.6}.hidden{display:none!important} .data-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:13px} .empty-icon{font-size:23px}
    @media(min-width:600px){.shell{min-height:100vh}body{padding:14px 0}.bottom-nav{bottom:0}}
    @media(max-width:370px){.main{padding-left:14px;padding-right:14px}.topbar{padding-left:14px;padding-right:14px}.hero{padding:17px 15px;gap:10px}.ring{width:112px;height:112px}.ring-core{width:90px;height:90px}.hero-title{font-size:18px}.date-text{font-size:23px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
    .cloud-mode .meal-add,.cloud-mode .pill-btn,.cloud-mode .quick-heading,.cloud-mode .quick,.cloud-mode [data-import],.cloud-mode [data-action]{display:none}.cloud-mode .food-click:disabled{opacity:1;cursor:default;color:var(--ink);-webkit-text-fill-color:var(--ink)}.cloud-mode .note-input{min-height:110px}
    .cloud-status{margin:0 20px 8px;padding:10px 12px;border-radius:12px;background:#e8f3eb;color:#32674c;font-size:11px;line-height:1.5;display:flex;align-items:center;justify-content:space-between;gap:8px}.cloud-status.error{background:#fff2e8;color:#9a593e}.cloud-status button{border:0;background:transparent;color:inherit;font-weight:800;white-space:nowrap}
  </style>

<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="logo"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4c-7 0-13 3-13 10 0 3 2 5 5 5 7 0 10-6 8-15Z"/><path d="M5 21c3-7 7-10 13-13"/></svg></div><div><div class="brandname">轻盈日记</div><div class="branddesc">EAT WELL · FEEL LIGHT</div></div></div>
    <button class="avatar" type="button" data-nav="settings" aria-label="打开我的设置"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-8 8-8s8 3 8 8"/></svg></button>
  </header>
  <div id="cloud-status" class="cloud-status hidden" role="status"><span id="cloud-status-text">正在读取云端记录…</span><button id="cloud-refresh" type="button">刷新</button></div>
  <main class="main" id="app" aria-live="polite"></main>
  <nav class="bottom-nav" aria-label="主导航">
    <button class="navitem active" data-nav="today" aria-label="今日记录"><span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10Z"/><path d="M9 21v-8h6v8"/></svg></span>今日</button>
    <button class="navitem" data-nav="trends" aria-label="查看趋势"><span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 19V5M3 19h18M7 15l4-5 4 3 5-7"/></svg></span>趋势</button>
    <button class="navitem" data-nav="history" aria-label="查看日历"><span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></svg></span>记录</button>
    <button class="navitem" data-nav="settings" aria-label="设置与备份"><span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="white"/><circle cx="15" cy="12" r="2" fill="white"/><circle cx="8" cy="17" r="2" fill="white"/></svg></span>我的</button>
  </nav>
</div>
<dialog id="food-dialog" aria-label="添加饮食">
  <div class="dialog-body">
    <div class="dialog-head"><span class="dialog-title" id="food-dialog-title">添加食物</span><button class="close" type="button" data-close="food-dialog" aria-label="关闭">×</button></div>
    <form id="food-form" class="dialog-form">
      <input type="hidden" id="food-edit-id" />
      <div class="field"><label for="food-meal">餐次</label><select id="food-meal" class="input"><option value="breakfast">早餐</option><option value="lunch">午餐</option><option value="dinner">晚餐</option><option value="snack">加餐</option></select></div>
      <div id="preset-box">
        <input class="search-box" id="food-search" placeholder="搜索常见食物：鸡蛋、米饭、牛奶…" autocomplete="off" />
        <div id="preset-list" class="preset-list"></div>
      </div>
      <div class="field"><label for="food-name">食物名称</label><input class="input" id="food-name" placeholder="例如：水煮蛋" maxlength="70" required /></div>
      <div class="dialog-num"><div class="field"><label for="food-amount">食用份量</label><input class="input" id="food-amount" type="number" min="0.01" max="10000" step="any" required /></div><div class="field"><label for="food-unit">份量单位</label><select class="input" id="food-unit"><option value="g">克(g)</option><option value="ml">毫升(ml)</option><option value="个">个</option><option value="片">片</option><option value="份">份</option><option value="盒">盒</option><option value="杯">杯</option></select></div></div>
      <p class="dialog-label" style="margin:5px 0 9px">本次吃下的营养总量（可以手动修正）</p>
      <div class="dialog-num"><div class="field"><label for="food-kcal">热量 kcal</label><input class="input" id="food-kcal" type="number" min="0" max="20000" step="any" placeholder="不清楚可留空" /></div><div class="field"><label for="food-protein">蛋白质 g</label><input class="input" id="food-protein" type="number" min="0" max="1000" step="any" placeholder="不清楚可留空" /></div><div class="field"><label for="food-carbs">碳水 g（选填）</label><input class="input" id="food-carbs" type="number" min="0" max="1000" step="any" /></div><div class="field"><label for="food-fat">脂肪 g（选填）</label><input class="input" id="food-fat" type="number" min="0" max="1000" step="any" /></div></div>
      <div class="dialog-actions"><button type="button" class="secondary hidden" id="food-delete">删除记录</button><button type="submit" class="primary">保存食物</button></div>
    </form>
    <div class="chart-helper">数据库为常见食物的参考估算值，实际份量、包装营养成分和烹调油需要自行核对。</div>
  </div>
</dialog>
<dialog id="weight-dialog" aria-label="记录体重">
  <div class="dialog-body"><div class="dialog-head"><span class="dialog-title">记录当天体重</span><button class="close" type="button" data-close="weight-dialog">×</button></div>
    <form id="weight-form"><div class="field"><label for="weight-date">日期</label><input type="date" class="input" id="weight-date" required/></div><div class="field"><label for="weight-value">体重（kg）</label><input type="number" class="input" id="weight-value" min="20" max="350" step="0.1" placeholder="如 79.8" required /></div><div class="dialog-actions"><button type="button" id="weight-delete" class="secondary hidden">删除这天的体重</button><button class="primary" type="submit">保存体重</button></div></form>
    <p class="chart-helper">建议在每天早晨起床、如厕后、早餐前称重。漏记的日期会保持空白。</p>
  </div>
</dialog>
<input id="backup-input" type="file" accept="application/json,.json" class="hidden" />
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./cloud-client.js"></script>
<script>
'use strict';
(()=>{

const cleanNum=(n,def=0)=>{const v=Number(n);return Number.isFinite(v)?v:def};const fmt=(n,dp=0)=>Number(n).toLocaleString('zh-CN',{maximumFractionDigits:dp,minimumFractionDigits:dp});

function entry(date,create=false){if(!store.entries[date]&&create)store.entries[date]={weight:null,foods:[],note:''};return store.entries[date]||{weight:null,foods:[],note:''}}
function foodTotal(arr){return (arr||[]).reduce((o,x)=>{for(const k of ['kcal','protein','carbs','fat'])o[k]+=cleanNum(x[k]);return o},{kcal:0,protein:0,carbs:0,fat:0})}

function todayPage(){const e=entry(selected),total=foodTotal(e.foods);const cal=store.settings.kcal,protein=store.settings.protein;const cp=Math.min(100,total.kcal/cal*100),pp=Math.min(100,total.protein/protein*100),missing=unestimated(e.foods);const displayWeight=e.weight!=null?`${fmt(e.weight,1)} <span class="unit">kg</span>`:'— <span class="unit">kg</span>';const weekday=(new Date(selected+'T12:00:00')).getDay();const greeting=(selected===todayISO()?'今天':`这一天`);
return `<div class="date-nav"><div><div class="eyebrow">${selected===todayISO()?'今天，照顾好自己':'你的饮食日记'}</div><div class="date-text">${niceDate(selected)}</div></div><div class="date-actions"><button class="icon-btn" data-day="-1" aria-label="前一天" style="transform:rotate(180deg)">${icons.chev}</button><button class="icon-btn" data-day="1" aria-label="后一天" ${selected>=todayISO()?'disabled':''}>${icons.chev}</button></div></div>

<div class="section-head quick-heading"><h2>快速记录</h2><span class="hint">常见食物参考值</span></div><div class="quick">${['egg','white','rice','chicken','milk','banana','tofu'].map(id=>{const f=foods.find(x=>x.id===id);return `<button class="quick-item" data-quick="${f.id}"><span>${f.icon}</span>${f.name}</button>`}).join('')}</div>
<div class="section-head"><h2>今日备注</h2><span class="hint">选填</span></div><div class="card note-card"><textarea class="note-input" id="daily-note" placeholder="今天的饮食感受、活动量或其他想记下的事…">${esc(e.note||'')}</textarea></div><div class="tiny-foot">${cloudMode?'云端加密记录 · 每次打开自动检查更新':'数据仅保存在当前浏览器 · 请定期在「我的」中备份'}</div>`}
function getWeightItems(){return Object.entries(store.entries).filter(([d,e])=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&e&&e.weight!=null&&Number.isFinite(+e.weight)).map(([date,e])=>({date,weight:+e.weight})).sort((a,b)=>a.date.localeCompare(b.date))}
function averageRecentWeight(){const start=dateShift(todayISO(),-6);const e=getWeightItems().filter(x=>x.date>=start&&x.date<=todayISO());return e.length?e.reduce((a,b)=>a+b.weight,0)/e.length:null}
function chartWeight(items){if(items.length===0)return `<div class="chart-empty"><div class="empty-icon">📈</div><strong>还没有体重记录</strong><span>记录两次或以上，就能观察体重变化。</span></div>`;
const arr=items.slice(-30),W=375,H=198,left=33,right=8,top=20,bottom=30;const vals=arr.map(x=>x.weight),minV=Math.min(...vals),maxV=Math.max(...vals),range=Math.max(1,maxV-minV),min=Math.max(0,minV-range*.3),max=maxV+range*.3;
const beginMs=Date.parse(arr[0].date+'T12:00:00'),endMs=Date.parse(arr[arr.length-1].date+'T12:00:00');const x=i=>left+(arr.length===1?(W-left-right)/2:(Date.parse(arr[i].date+'T12:00:00')-beginMs)/(endMs-beginMs)*(W-left-right));const y=v=>top+(max-v)/(max-min)*(H-top-bottom);const points=arr.map((v,i)=>[x(i),y(v.weight)]);const poly=points.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');const bottomY=H-bottom;const area=arr.length>1?`${x(0)},${bottomY} ${poly} ${x(arr.length-1)},${bottomY}`:'';const ys=[0,.5,1].map(p=>({value:max-p*(max-min),y:top+p*(H-top-bottom)}));let labels=arr.length>2?[0,Math.floor((arr.length-1)/2),arr.length-1]:arr.map((_,i)=>i);
return `<svg class="weight-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="实际记录体重变化的折线图">${ys.map(o=>`<line x1="${left}" x2="${W-right}" y1="${o.y}" y2="${o.y}" stroke="#ebefe9"/><text x="2" y="${o.y+4}" fill="#9aaa9f" font-size="10">${fmt(o.value,1)}</text>`).join('')}${area?`<polygon points="${area}" fill="#e1f1e8"/>`:''}${arr.length>1?`<polyline points="${poly}" fill="none" stroke="#25775e" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`:''}${points.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===arr.length-1?5:3}" fill="${i===arr.length-1?'#25775e':'#a2cbb4'}" stroke="white" stroke-width="2"><title>${arr[i].date}: ${arr[i].weight}kg</title></circle>`).join('')}${labels.map(i=>`<text x="${x(i)}" y="${H-7}" text-anchor="middle" fill="#99a69c" font-size="10">${arr[i].date.slice(5).replace('-','/')}</text>`).join('')}</svg>`}
function trendsPage(){const items=getWeightItems();const recent=items.filter(x=>x.date<=todayISO());const last=recent.at(-1);const first=recent[0];const avg=averageRecentWeight();const progress=last?(store.settings.startWeight-last.weight):null;
const week=Array.from({length:7},(_,i)=>dateShift(todayISO(),i-6));let loggedDays=0;const bars=week.map(d=>{const e=entry(d),t=foodTotal(e.foods);if(e.foods.length)loggedDays++;return{date:d,kcal:t.kcal,logged:e.foods.length>0}});
return `<h1 class="page-title">看见每一点进步</h1><p class="page-sub">用真实记录观察趋势。体重偶尔上下波动很正常，更值得关注连续多天的变化。</p><div class="statrow"><div class="card statbox"><div class="statval">${last?fmt(last.weight,1):'—'}</div><div class="statlabel">最近体重 kg</div></div><div class="card statbox"><div class="statval">${avg?fmt(avg,1):'—'}</div><div class="statlabel">近7日均重 kg</div></div><div class="card statbox"><div class="statval">${progress!=null?`${progress>0?'−':progress<0?'+':''}${fmt(Math.abs(progress),1)}`:'—'}</div><div class="statlabel">较${fmt(store.settings.startWeight,1)}kg基准变化</div></div></div><div class="card chart-card"><div class="chart-head"><span class="chart-title">体重趋势</span><span class="chip">最近30次记录</span></div>${chartWeight(recent)}<div class="chart-helper">图中只绘制实际称重记录，不会自动补出未记录的日期。近7日均重仅使用最近7个自然日中实际记录的体重，缺失日期不参与平均。</div></div><div class="card chart-card"><div class="chart-head"><span class="chart-title">近7天热量记录</span><span class="chip">已记录 ${loggedDays}/7 天</span></div><div class="weekly-bars">${bars.map(b=>{const ratio=Math.min(100,b.kcal/store.settings.kcal*100);return `<div class="week-col"><div class="week-track">${b.logged?`<div class="week-fill" style="height:${Math.max(3,ratio)}%;background:${b.kcal>store.settings.kcal?'#e1a274':'#8dbca2'}" title="${b.date}: ${fmt(b.kcal)}kcal"></div>`:`<div class="week-blank">—</div>`}</div><div class="week-day">${Number(b.date.slice(-2))}日</div></div>`}).join('')}</div><div class="chart-helper">柱形图仅统计有热量数据的食物；未估算或漏记的食物会使柱形图低于实际摄入。空白表示当天尚无饮食记录。</div></div><div class="section-head"><h2>你的阶段目标</h2></div><div class="card weight-card"><div><div style="font-weight:800;font-size:17px">${fmt(store.settings.startWeight,1)} → ${fmt(store.settings.targetWeight,1)} kg</div><div class="weight-desc">起始基准 → 目标体重（由你设置）</div></div><button class="pill-btn" data-nav="settings">修改目标</button></div><div class="tiny-foot">趋势用于自我记录与观察，不构成医学诊断</div>`}
function historyPage(){const [yr,mo]=monthShown.split('-').map(Number);const start=new Date(yr,mo-1,1),weekday=(start.getDay()+6)%7,days=new Date(yr,mo,0).getDate();const cells=Array.from({length:weekday},()=>`<span></span>`);for(let d=1;d<=days;d++){const date=`${yr}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`,e=entry(date),has=isLogged(e);cells.push(`<button class="cal-day ${has?'has':''} ${selected===date?'selected':''} ${todayISO()===date?'today':''}" data-select="${date}" aria-label="${date}${has?'有记录':''}">${d}${has?'<i class="dot"></i>':''}</button>`)}
const logged=Object.entries(store.entries).filter(([d,e])=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&e&&isLogged(e)).sort((a,b)=>b[0].localeCompare(a[0]));return `<h1 class="page-title">你的每一天</h1><p class="page-sub">有记录的日期会显示绿色标记。点击任意日期即可查看、补记或修改。</p><div class="card calendar"><div class="cal-head"><button class="icon-btn" data-month="-1" style="transform:rotate(180deg)" aria-label="上个月">${icons.chev}</button><span class="cal-title">${yr}年 ${mo}月</span><button class="icon-btn" data-month="1" aria-label="下个月">${icons.chev}</button></div><div class="cal-grid">${['一','二','三','四','五','六','日'].map(w=>`<div class="cal-week">${w}</div>`).join('')}${cells.join('')}</div></div><div class="section-head"><h2>最近记录</h2><span class="hint">累计 ${logged.length} 天</span></div>${logged.length?`<div class="history-list">${logged.slice(0,30).map(([d,e])=>{const total=foodTotal(e.foods);return `<button class="history-item" data-select="${d}"><div><strong>${d.slice(5).replace('-','月')}日</strong><div class="muted">${e.weight!=null?`${fmt(e.weight,1)}kg · `:''}${(e.foods||[]).length} 条饮食记录${e.note?' · 有备注':''}</div></div><div class="history-stats">${e.foods.length?(unestimated(e.foods)?'已估算 ':'')+fmt(total.kcal)+' kcal':'—'}<small>蛋白 ${e.foods.length?fmt(total.protein,1)+'g'+(unestimated(e.foods)?'（部分待估算）':''):'—'}</small></div></button>`}).join('')}</div>`:`<div class="card chart-empty"><div class="empty-icon">🗓️</div>尚无记录。回到今日页记下第一顿饭吧。</div>`}<div class="tiny-foot">${cloudMode?'云端加密记录 · 每次打开自动检查更新':'记录不会自动上传，建议定期导出备份'}</div>`}
function settingsPage(){const s=store.settings;const count=Object.entries(store.entries).filter(([,e])=>e&&isLogged(e)).length;return `<h1 class="page-title">我的减脂计划</h1><p class="page-sub">${cloudMode?'这里展示云端记录与目标。请在对话中告诉我新的饮食和体重，我会更新数据。':'保持轻松、持续记录。可以根据进展调整热量、蛋白质及目标体重。'}</p><div class="banner">${cloudMode?'🔒 当前查看加密云端记录。新饮食和体重由对话更新；此设备保留上次同步的离线副本。':'🔒 当前只在本浏览器保存记录。若要在手机查看对话更新的云端记录，请使用专属连接链接在手机打开一次。'}</div><section class="card settings-card"><h3>${cloudMode?'更换云端密钥':'连接云端记录'}</h3><form id="cloud-connect-form"><div class="field"><label for="cloud-key-input">专属连接密钥</label><input id="cloud-key-input" class="input" type="password" autocomplete="off" placeholder="粘贴 43 位密钥" required /></div><button class="primary" type="submit" style="width:100%">连接云端</button></form><p class="chart-helper">连接后会显示云端记录；此设备原有本地记录仍会保留，但不会自动合并。</p></section><section class="card settings-card"><h3>每日目标</h3><form id="settings-form"><div class="field-row"><div class="field"><label for="setting-kcal">每日热量 kcal</label><input id="setting-kcal" class="input" type="number" min="800" max="6000" step="50" required value="${esc(s.kcal)}"/></div><div class="field"><label for="setting-protein">每日蛋白质 g</label><input id="setting-protein" class="input" type="number" min="20" max="350" step="5" required value="${esc(s.protein)}"/></div></div><div class="field-row"><div class="field"><label for="setting-start">起始体重 kg</label><input id="setting-start" class="input" type="number" min="20" max="350" step="0.1" required value="${esc(s.startWeight)}"/></div><div class="field"><label for="setting-target">目标体重 kg</label><input id="setting-target" class="input" type="number" min="20" max="350" step="0.1" required value="${esc(s.targetWeight)}"/></div></div><button class="primary" type="submit" style="width:100%">保存目标设置</button></form></section><section class="card settings-card"><h3>数据与备份</h3><div class="settings-actions"><button class="action-row" data-export="json"><span><strong>导出完整备份（JSON）</strong><small>包含所有日期、食物、体重和目标；更换手机可导入</small></span>${icons.down}</button><button class="action-row" data-export="csv"><span><strong>导出饮食与体重（CSV）</strong><small>方便用 Excel 或表格软件查看</small></span>${icons.down}</button><button class="action-row" data-import="json"><span><strong>从备份文件恢复</strong><small>导入会覆盖此设备中的现有记录</small></span>${icons.up}</button><button class="action-row" data-action="delete-all"><span><strong class="danger">清空所有记录</strong><small>永久清除本浏览器的已保存内容</small></span>${icons.chev}</button></div></section><div class="alert"><strong>关于数据保存</strong><br/>已记录 ${count} 天。${cloudMode?'页面打开或重新显示时会读取云端最新记录；断网时显示上次同步的副本。请保管好专属连接密钥，丢失后无法解密云端记录。':'清除浏览器网站数据、切换浏览器或重置设备可能导致记录丢失。请定期导出完整备份。'}</div><div class="tiny-foot">轻盈日记 · 本地优先 · 数据由你掌控</div>`}
function bindDynamic(){const n=document.getElementById('daily-note');if(n){n.addEventListener('input',()=>{clearTimeout(saveNoteTimer);const date=selected,value=n.value;saveNoteTimer=setTimeout(()=>{entry(date,true).note=value;save()},320)})}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2700)}
function nav(id){tab=id;if(tab==='history')monthShown=selected.slice(0,7);render();window.scrollTo(0,0)}
function showDialog(id){const el=document.getElementById(id);if(typeof el.showModal==='function')el.showModal();else el.setAttribute('open','')}
function closeDialog(id){const el=document.getElementById(id);if(typeof el.close==='function')el.close();else el.removeAttribute('open')}
function presetList(q=''){const list=foods.filter(f=>f.name.toLowerCase().includes(q.trim().toLowerCase()));document.getElementById('preset-list').innerHTML=list.length?list.map(f=>`<button type="button" class="preset-option" data-preset="${f.id}"><strong>${f.icon} ${esc(f.name)}</strong><small>${f.qty}${f.unit} · ${f.kcal}kcal · 蛋白${f.protein}g</small></button>`).join(''):`<div class="meal-empty" style="text-align:center">没有匹配项，可在下面手动填写</div>`}
function applyPreset(id){const p=foods.find(f=>f.id===id);if(!p)return;activePreset=p;document.getElementById('food-name').value=p.name;document.getElementById('food-amount').value=p.qty;document.getElementById('food-unit').value=p.unit;for(const k of ['kcal','protein','carbs','fat'])document.getElementById('food-'+k).value=p[k]}
function updateFromPreset(){if(!activePreset)return;const amount=Number(document.getElementById('food-amount').value);if(!Number.isFinite(amount)||amount<0)return;const ratio=amount/activePreset.qty;for(const k of ['kcal','protein','carbs','fat'])document.getElementById('food-'+k).value=Number((activePreset[k]*ratio).toFixed(2))}
function openFood(meal='breakfast',presetId=null,editId=null){const form=document.getElementById('food-form');form.reset();activePreset=null;document.getElementById('food-edit-id').value='';document.getElementById('food-meal').value=meal;document.getElementById('food-dialog-title').textContent=editId?'修改食物':'添加食物';document.getElementById('food-delete').classList.toggle('hidden',!editId);document.getElementById('preset-box').classList.toggle('hidden',Boolean(editId));presetList();document.getElementById('food-search').value='';if(editId){const f=entry(selected).foods.find(x=>x.id===editId);if(!f)return;document.getElementById('food-edit-id').value=f.id;document.getElementById('food-meal').value=f.meal;document.getElementById('food-name').value=f.name;document.getElementById('food-amount').value=f.qty;document.getElementById('food-unit').value=f.unit;for(const k of ['kcal','protein','carbs','fat'])document.getElementById('food-'+k).value=f[k]??''}else if(presetId)applyPreset(presetId);showDialog('food-dialog')}
function openWeight(date){document.getElementById('weight-date').value=date;const v=entry(date).weight;document.getElementById('weight-value').value=v==null?'':v;document.getElementById('weight-delete').classList.toggle('hidden',v==null);showDialog('weight-dialog')}
function download(filename,blob){const link=document.createElement('a'),url=URL.createObjectURL(blob);link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function exportCSV(){const lines=[['日期','体重(kg)','餐次','食物','食用份量','单位','热量(kcal)','蛋白质(g)','碳水(g)','脂肪(g)','备注']];for(const d of Object.keys(store.entries).sort()){const e=store.entries[d];if(!e||!isLogged(e))continue;if(e.foods.length){for(const f of e.foods)lines.push([d,e.weight??'',meals.find(m=>m[0]===f.meal)?.[1]||'',f.name,f.qty,f.unit,f.kcal,f.protein,f.carbs??'',f.fat??'',e.note||''])}else lines.push([d,e.weight??'','','','','','','','','',e.note||''])}const csv='\ufeff'+lines.map(arr=>arr.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');download('轻盈日记_饮食体重_'+todayISO()+'.csv',new Blob([csv],{type:'text/csv;charset=utf-8'}))}
function validImport(o){if(!o||o.version!==1||!o.settings||!o.entries||typeof o.entries!=='object'||Array.isArray(o.entries))return false;const s=o.settings;for(const k of ['startWeight','targetWeight','kcal','protein'])if(!Number.isFinite(Number(s[k]))||Number(s[k])<=0)return false;for(const [d,e] of Object.entries(o.entries)){if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!e||typeof e!=='object'||!Array.isArray(e.foods)||e.foods.length>2000)return false;if(e.weight!=null&&(!Number.isFinite(Number(e.weight))||+e.weight<20||+e.weight>350))return false;for(const f of e.foods){if(!f||typeof f.name!=='string'||f.name.length>200||!['breakfast','lunch','dinner','snack'].includes(f.meal)||(f.kcal!=null&&(!Number.isFinite(Number(f.kcal))||Number(f.kcal)<0))||(f.protein!=null&&(!Number.isFinite(Number(f.protein))||Number(f.protein)<0)))return false}}return true}
function changeMonth(delta){const [y,m]=monthShown.split('-').map(Number);const d=new Date(y,m-1+delta,1);monthShown=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render()}
// Event delegation helps preserve input state across page changes.
document.addEventListener('click',async ev=>{const b=ev.target.closest('button');if(!b)return;
if(b.dataset.nav){nav(b.dataset.nav);return}
if(b.dataset.day){const d=dateShift(selected,Number(b.dataset.day));if(d<=todayISO()){selected=d;render()}return}
if(b.dataset.add){openFood(b.dataset.add);return}
if(b.dataset.quick){openFood('snack',b.dataset.quick);return}
if(b.dataset.edit){openFood('breakfast',null,b.dataset.edit);return}
if(b.dataset.weight){openWeight(b.dataset.weight);return}
if(b.dataset.close){closeDialog(b.dataset.close);return}
if(b.dataset.preset){applyPreset(b.dataset.preset);return}
if(b.dataset.month){changeMonth(Number(b.dataset.month));return}
if(b.dataset.select){selected=b.dataset.select;nav('today');return}
if(b.dataset.export==='json'){download('轻盈日记_完整备份_'+todayISO()+'.json',new Blob([JSON.stringify(store,null,2)],{type:'application/json;charset=utf-8'}));toast('完整备份已导出');return}
if(b.dataset.export==='csv'){exportCSV();toast('CSV 已导出');return}
if(b.dataset.import==='json'){document.getElementById('backup-input').click();return}
if(b.dataset.action==='delete-all'){if(confirm('确定清空全部饮食、体重和备注吗？此操作无法撤销。请先导出备份。')&&confirm('再次确认：永久删除当前浏览器中的所有记录？')){store=JSON.parse(JSON.stringify(defaults));save();nav('settings');toast('记录已清空')}return}
});
document.getElementById('food-search').addEventListener('input',e=>presetList(e.target.value));
document.getElementById('food-amount').addEventListener('input',updateFromPreset);
document.getElementById('food-unit').addEventListener('change',e=>{if(activePreset&&e.target.value!==activePreset.unit)activePreset=null});
document.getElementById('food-name').addEventListener('input',e=>{if(activePreset&&e.target.value!==activePreset.name)activePreset=null});
document.getElementById('food-form').addEventListener('submit',e=>{e.preventDefault();const fd=(id)=>document.getElementById(id),id=fd('food-edit-id').value,name=fd('food-name').value.trim(),qty=Number(fd('food-amount').value),unit=fd('food-unit').value,meal=fd('food-meal').value;const vals={};for(const k of ['kcal','protein','carbs','fat']){const raw=fd('food-'+k).value.trim();vals[k]=raw===''?null:Number(raw)}if(!name||!Number.isFinite(qty)||qty<=0||!Object.values(vals).every(v=>v==null||(Number.isFinite(v)&&v>=0))){toast('请检查食物名称、份量和营养数据');return}if(vals.kcal>20000||qty>10000||vals.protein>1000){toast('数值过大，请检查单位');return}
const e1=entry(selected,true),food={id:id||String(Date.now())+'-'+Math.random().toString(36).slice(2,9),name,qty,unit,meal,...vals};if(id){const i=e1.foods.findIndex(x=>x.id===id);if(i>=0)e1.foods[i]=food;else e1.foods.push(food)}else e1.foods.push(food);save();closeDialog('food-dialog');render();toast('饮食记录已保存')});
document.getElementById('food-delete').addEventListener('click',()=>{const id=document.getElementById('food-edit-id').value;if(!id)return;const e=entry(selected,true);e.foods=e.foods.filter(f=>f.id!==id);save();closeDialog('food-dialog');render();toast('已删除这条食物记录')});
document.getElementById('weight-form').addEventListener('submit',e=>{e.preventDefault();const date=document.getElementById('weight-date').value,value=Number(document.getElementById('weight-value').value);if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(value)||value<20||value>350){toast('请输入有效日期和体重');return}entry(date,true).weight=value;save();closeDialog('weight-dialog');if(date===selected)render();else{selected=date;nav('today')}toast('体重已记录')});
document.getElementById('weight-delete').addEventListener('click',()=>{const date=document.getElementById('weight-date').value;if(confirm(`确定删除 ${date} 的体重记录吗？`)){entry(date,true).weight=null;save();closeDialog('weight-dialog');render();toast('已删除体重记录')}});
document.addEventListener('submit',e=>{if(e.target.id==='settings-form'){e.preventDefault();const get=k=>Number(document.getElementById('setting-'+k).value),s={kcal:get('kcal'),protein:get('protein'),startWeight:get('start'),targetWeight:get('target')};if(!(s.kcal>=800&&s.kcal<=6000&&s.protein>=20&&s.protein<=350&&s.startWeight>=20&&s.startWeight<=350&&s.targetWeight>=20&&s.targetWeight<=350)){toast('目标数值超出合理输入范围');return}store.settings=s;save();render();toast('目标设置已保存')}});
document.getElementById('backup-input').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>15*1024*1024){toast('备份文件过大');return}try{const data=JSON.parse(await file.text());if(!validImport(data)){toast('备份格式不符合要求');return}if(!confirm('导入将覆盖当前浏览器中的所有现有记录。确定继续吗？'))return;store={version:1,settings:{startWeight:Number(data.settings.startWeight),targetWeight:Number(data.settings.targetWeight),kcal:Number(data.settings.kcal),protein:Number(data.settings.protein)},entries:data.entries};if(save()){nav('today');toast('备份恢复成功')}}catch(e){toast('导入失败，请检查 JSON 文件')}});
for(const dialog of document.querySelectorAll('dialog'))dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
document.getElementById('cloud-refresh').addEventListener('click',refreshCloud);
document.addEventListener('submit',event=>{if(event.target.id!=='cloud-connect-form')return;event.preventDefault();const value=document.getElementById('cloud-key-input').value;if(cloud.connect(value))location.reload();else toast('密钥格式不正确，请检查后重试')});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCloud()});
render();
if(cloudMode)refreshCloud();
})();
</script>
</body>
</html>
